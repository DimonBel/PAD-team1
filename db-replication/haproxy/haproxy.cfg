# Sends each client to the right node of one Patroni cluster (CLUSTER=player, game, zombie, resource, base, crafting, world or exam):
#   :5432  the leader only (writes)   - Patroni answers 200 on /primary only on the leader
#   :5433  the replicas (reads)       - 200 on /replica only on a running replica
#   :8404  stats page (/stats; ;csv for the healthcheck)
# When the leader changes, its server is marked down and its connections are cut
# (on-marked-down shutdown-sessions), so the services' pools reconnect to the new leader.
global
  maxconn 1000

defaults
  mode tcp
  timeout connect 3s
  timeout client 30m
  timeout server 30m
  timeout check 2s
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker check port 8008

#the dns server comes from the container's own resolv.conf: 127.0.0.11 under docker, the network gateway under podman
resolvers docker
  parse-resolv-conf
  hold valid 5s

listen stats
  mode http
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s

listen primary
  bind :5432
  option httpchk GET /primary
  http-check expect status 200
  server "${CLUSTER}-db-1" "${CLUSTER}-db-1:5432"
  server "${CLUSTER}-db-2" "${CLUSTER}-db-2:5432"
  server "${CLUSTER}-db-3" "${CLUSTER}-db-3:5432"

listen replicas
  bind :5433
  balance roundrobin
  option httpchk GET /replica
  http-check expect status 200
  server "${CLUSTER}-db-1" "${CLUSTER}-db-1:5432"
  server "${CLUSTER}-db-2" "${CLUSTER}-db-2:5432"
  server "${CLUSTER}-db-3" "${CLUSTER}-db-3:5432"
