# Runs the team's services from the images published on Docker Hub.
# Nothing here builds from a Dockerfile on purpose: the images are the artefact.
#
#   cp .env.example .env     # then fill in every secret
#   docker compose up -d
#
# Each service keeps its own Postgres and its own named volume, so no service can
# read another one's tables. Ports are distinct so everything runs at once.

services:
  # ---------------------------------------------------------------- base-service
  base-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${BASE_DB_USER:-base}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:?set BASE_DB_PASSWORD in .env}
      POSTGRES_DB: ${BASE_DB_NAME:-base_service}
    volumes:
      - base-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASE_DB_USER:-base} -d ${BASE_DB_NAME:-base_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  base-service:
    image: cobili/base-service:0.1.0
    depends_on:
      base-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${BASE_DB_USER:-base}:${BASE_DB_PASSWORD}@base-db:5432/${BASE_DB_NAME:-base_service}
      PORT: 4007
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      RESOURCE_SERVICE_URL: http://resource-service:4006
      WORLD_SERVICE_URL: http://world-service:4004
      PLAYER_SERVICE_URL: http://player-service:${PLAYER_PHX_PORT:-4000}
    ports:
      - "4007:4007"

  # ------------------------------------------------------------ crafting-service
  crafting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CRAFTING_DB_USER:-crafting}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:?set CRAFTING_DB_PASSWORD in .env}
      POSTGRES_DB: ${CRAFTING_DB_NAME:-crafting_service}
    volumes:
      - crafting-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRAFTING_DB_USER:-crafting} -d ${CRAFTING_DB_NAME:-crafting_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crafting-service:
    image: cobili/crafting-service:0.1.0
    depends_on:
      crafting-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CRAFTING_DB_USER:-crafting}:${CRAFTING_DB_PASSWORD}@crafting-db:5432/${CRAFTING_DB_NAME:-crafting_service}
      PORT: 4008
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      RESOURCE_SERVICE_URL: http://resource-service:4006
      PLAYER_SERVICE_URL: http://player-service:${PLAYER_PHX_PORT:-4000}
      EXAM_SERVICE_URL: http://exam-service:4005
      WORLD_SERVICE_URL: http://world-service:4004
    ports:
      - "4008:4008"

  # --------------------------------------------------------------- world-service
  world-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${WORLD_POSTGRES_USER:-world_service}
      POSTGRES_PASSWORD: ${WORLD_POSTGRES_PASSWORD:?set WORLD_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${WORLD_POSTGRES_DB:-world_service_dev}
    ports:
      - "${WORLD_DB_HOST_PORT:-5434}:5432"
    volumes:
      - world-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORLD_POSTGRES_USER:-world_service} -d ${WORLD_POSTGRES_DB:-world_service_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  world-service:
    image: alexandramihalevschi/world-service:0.2.0
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    platform: linux/amd64 # no arm64 manifest published yet — required on Apple Silicon
    tty: true # OTP release needs a pty for its user/console process or the VM crashes with "nouser"
    stdin_open: true
    depends_on:
      world-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${WORLD_POSTGRES_USER:-world_service}:${WORLD_POSTGRES_PASSWORD}@world-db:5432/${WORLD_POSTGRES_DB:-world_service_dev}
      PORT: ${WORLD_PHX_PORT:-4004}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
    ports:
      - "${WORLD_HOST_PORT:-4004}:${WORLD_PHX_PORT:-4004}"

  # ---------------------------------------------------------------- exam-service
  exam-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${EXAM_POSTGRES_USER:-exam_service}
      POSTGRES_PASSWORD: ${EXAM_POSTGRES_PASSWORD:?set EXAM_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${EXAM_POSTGRES_DB:-exam_service_dev}
    ports:
      - "${EXAM_DB_HOST_PORT:-5435}:5432"
    volumes:
      - exam-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXAM_POSTGRES_USER:-exam_service} -d ${EXAM_POSTGRES_DB:-exam_service_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  exam-service:
    image: alexandramihalevschi/exam-service:0.2.0
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/server"]
    platform: linux/amd64 # same publisher/build as world-service — likely amd64-only too
    tty: true # OTP release needs a pty for its user/console process or the VM crashes with "nouser"
    stdin_open: true
    depends_on:
      exam-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${EXAM_POSTGRES_USER:-exam_service}:${EXAM_POSTGRES_PASSWORD}@exam-db:5432/${EXAM_POSTGRES_DB:-exam_service_dev}
      PORT: ${EXAM_PHX_PORT:-4005}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
    ports:
      - "${EXAM_HOST_PORT:-4005}:${EXAM_PHX_PORT:-4005}"

  # -------------------------------------------------------------- player-service
  player-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-player_service}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:?set PLAYER_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-player_service_dev}
    ports:
      - "${PLAYER_DB_HOST_PORT:-5432}:5432"
    volumes:
      - player-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYER_POSTGRES_USER:-player_service} -d ${PLAYER_POSTGRES_DB:-player_service_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  player-service:
    image: dimon1/player-service:0.1.1
    tty: true # OTP release needs a pty for its user/console process or the VM crashes with "nouser"
    stdin_open: true
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${PLAYER_POSTGRES_USER:-player_service}:${PLAYER_POSTGRES_PASSWORD}@player-db:5432/${PLAYER_POSTGRES_DB:-player_service_dev}
      PORT: ${PLAYER_PHX_PORT:-4000}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:?set INTERNAL_JWT_SECRET in .env}
      TRADE_TTL_SECONDS: ${TRADE_TTL_SECONDS:-600}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      DEV_TOKEN: ${DEV_TOKEN:-change-me-dev-token}
    ports:
      - "${PLAYER_HOST_PORT:-4000}:${PLAYER_PHX_PORT:-4000}"

  # ---------------------------------------------------------------- game-service
  game-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${GAME_POSTGRES_USER:-game_service}
      POSTGRES_PASSWORD: ${GAME_POSTGRES_PASSWORD:?set GAME_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${GAME_POSTGRES_DB:-game_service_prod}
    ports:
      - "${GAME_DB_HOST_PORT:-5433}:5432"
    volumes:
      - game-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAME_POSTGRES_USER:-game_service} -d ${GAME_POSTGRES_DB:-game_service_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-service:
    image: dimon1/game-service:0.1.0
    tty: true # OTP release needs a pty for its user/console process or the VM crashes with "nouser"
    stdin_open: true
    depends_on:
      game-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${GAME_DATABASE_URL:?set GAME_DATABASE_URL in .env}
      PORT: ${GAME_PORT:-4000}
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      BYPASS_AUTH: ${BYPASS_AUTH:-true}
      BYPASS_PLAYER_ID: ${BYPASS_PLAYER_ID:-11111111-1111-1111-1111-111111111111}
    ports:
      - "${GAME_HOST_PORT:-4001}:${GAME_PORT:-4000}"

  # -------------------------------------------------------------- zombie-service
  zombie-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ZOMBIE_DB_USER:-zombie}
      POSTGRES_PASSWORD: ${ZOMBIE_DB_PASSWORD:?set ZOMBIE_DB_PASSWORD in .env}
      POSTGRES_DB: ${ZOMBIE_DB_NAME:-zombie_service}
    volumes:
      - zombie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZOMBIE_DB_USER:-zombie} -d ${ZOMBIE_DB_NAME:-zombie_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zombie-service:
    image: tukaram40k/zombie-service:0.1.0
    depends_on:
      zombie-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${ZOMBIE_DB_USER:-zombie}:${ZOMBIE_DB_PASSWORD}@zombie-db:5432/${ZOMBIE_DB_NAME:-zombie_service}
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
      MOCK_MODE: ${MOCK_MODE:-true}
      PLAYER_SERVICE_URL: http://player-service:${PLAYER_PHX_PORT:-4000}
      RESOURCE_SERVICE_URL: http://resource-service:4006
      WORLD_SERVICE_URL: http://world-service:4004
    ports:
      - "4003:4003"

  # ------------------------------------------------------------ resource-service
  resource-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${RESOURCE_DB_USER:-resource}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD in .env}
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resource_service}
    volumes:
      - resource-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_DB_USER:-resource} -d ${RESOURCE_DB_NAME:-resource_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-service:
    image: tukaram40k/resource-service:0.1.0
    depends_on:
      resource-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${RESOURCE_DB_USER:-resource}:${RESOURCE_DB_PASSWORD}@resource-db:5432/${RESOURCE_DB_NAME:-resource_service}
      PORT: 4006
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env}
    ports:
      - "4006:4006"

  # All 8 services are here. base/crafting/zombie run with MOCK_MODE=true and game with
  # BYPASS_AUTH=true while the cross-service wiring isn't finished. exam-service and
  # world-service have no toggle: their outbound calls are stubs that only log.

volumes:
  base-pgdata:
  crafting-pgdata:
  world-pgdata:
  exam-pgdata:
  player-pgdata:
  game-pgdata:
  zombie-pgdata:
  resource-pgdata:
