# Runs the team's services from the images published on Docker Hub.
# Nothing here builds from a Dockerfile on purpose: the images are the artefact. The one exception
# is the Patroni image of the replicated databases (db-replication/patroni), built once on the first
# `docker compose up`; PATRONI_IMAGE can point at a published tag instead.
#
#   cp .env.example .env     # then fill in every secret
#   docker compose up -d
#
# Each service keeps its own Postgres and its own named volume, so no service can
# read another one's tables. Ports are distinct so everything runs at once.
#
# Lab 3: every service registers itself with Service Discovery, and the gateway
# round-robins over the instances it lists as up. zombie, resource, base,
# crafting, world and exam run as replicas (*_REPLICAS, default 2) and publish
# no host port: replicas can't share one, and every call comes through the
# gateway anyway. player-service and game-service stay single and keep their
# host ports, because clients open their WebSockets on them directly.
# Check a replica's health from inside it, e.g.
#   docker compose exec zombie-service ruby -rnet/http -e 'puts Net::HTTP.get(URI("http://localhost:4003/health"))'

# Every service runs a published Docker Hub image (pull_policy: always): `docker compose up` pulls the
# newest build of each tag and never builds anything locally. Use GATEWAY_IMAGE / SERVICE_DISCOVERY_IMAGE /
# PLAYER_IMAGE / GAME_IMAGE in .env to pin another tag.
# ------------------------------------------------------- database replication (Lab 5)
# Every service's database is a Patroni cluster of three Postgres nodes: one leader and two
# streaming replicas (one of them synchronous), with automatic failover coordinated through etcd (one
# etcd for all eight clusters, one scope each). The names base-db, crafting-db, world-db, exam-db,
# zombie-db, resource-db, player-db and game-db belong to HAProxy, which always points :5432 at the
# current leader and :5433 at the replicas, so no service's DATABASE_URL changed, and no service's
# code did either. See db-replication/README.md.
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 10

# The nodes run the image exam-db-1 builds (only one service builds it, so the nodes don't race to
# tag the same image).
x-patroni: &patroni
  image: ${PATRONI_IMAGE:-pad-team1/patroni:local}
  pull_policy: never
  restart: unless-stopped
  depends_on:
    etcd-1:
      condition: service_healthy
    etcd-2:
      condition: service_healthy
    etcd-3:
      condition: service_healthy

x-patroni-env: &patroni-env
  PATRONI_ETCD3_HOSTS: "'etcd-1:2379','etcd-2:2379','etcd-3:2379'"
  PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:?set PATRONI_SUPERUSER_PASSWORD in .env}
  PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?set PATRONI_REPLICATION_PASSWORD in .env}
  PATRONI_REWIND_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?set PATRONI_RESTAPI_PASSWORD in .env}

x-db-router: &db-router
  image: haproxy:3.0-alpine
  pull_policy: always
  restart: unless-stopped
  volumes:
    - ./db-replication/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  deploy:
    replicas: 2
  healthcheck:
    # Healthy once the primary backend has a leader to send connections to.
    test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8404/stats;csv' | grep -q '^primary,BACKEND,.*,UP,'"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  # --------------------------------------------- etcd: Patroni's leader election (quorum 2 of 3)
  etcd-1:
    <<: *etcd
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pad-team1-etcd
    volumes:
      - etcd-1:/etcd-data

  etcd-2:
    <<: *etcd
    command:
      - etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pad-team1-etcd
    volumes:
      - etcd-2:/etcd-data

  etcd-3:
    <<: *etcd
    command:
      - etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pad-team1-etcd
    volumes:
      - etcd-3:/etcd-data

  # --------------------------------------------- pgAdmin: look at the replication (Lab 5, optional)
  # Not started by default:  docker compose --profile dbadmin up -d pgadmin   then http://localhost:5050
  # Every node of exam-db and world-db is listed on its own (db-replication/pgadmin/servers.json), plus
  # each router's :5432 (leader) and :5433 (a replica), so a row written through a service can be
  # looked up on each node. Logs in as postgres; the pgpass file is written from PATRONI_SUPERUSER_PASSWORD.
  pgadmin:
    image: dpage/pgadmin4:8.14
    profiles: ["dbadmin"]
    pull_policy: missing
    entrypoint:
      - /bin/sh
      - -c
      - echo "*:*:*:postgres:$$PGPASS_PASSWORD" > /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh
    environment:
      PGPASS_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Desktop mode: no pgAdmin login page, and no master password prompt.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./db-replication/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"

  # ----------------------------------------------------------- service-discovery
  service-discovery:
    image: ${SERVICE_DISCOVERY_IMAGE:-dimon1/service-discovery:3.1.5-amd64}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8500"
      # debug also logs a summary of every health sweep.
      LOG_LEVEL: ${SD_LOG_LEVEL:-info}
      # Empty: registration is open. Set it to require X-Discovery-Key on writes;
      # every service below sends the same value.
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
      HEALTH_CHECK_INTERVAL_MS: ${HEALTH_CHECK_INTERVAL_MS:-10000}
      # Health alerts (down / removed / recovered) go to this Discord webhook. Empty: alerts off.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-60000}
      # Periodic all-services digest on the same webhook: 0 = off, otherwise every this many ms.
      DIGEST_INTERVAL_MS: ${DIGEST_INTERVAL_MS:-0}
    ports:
      - "${SERVICE_DISCOVERY_HOST_PORT:-8500}:8500"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8500/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- base-service
  # --------------------------------------------- base-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  base-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: base
      PATRONI_NAME: base-db-1
      APP_DB_USER: ${BASE_DB_USER:-base}
      APP_DB_PASSWORD: ${BASE_DB_PASSWORD:?set BASE_DB_PASSWORD in .env}
      APP_DB_NAME: ${BASE_DB_NAME:-base_service}
    volumes:
      - base-pg-1:/var/lib/postgresql/data

  base-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: base
      PATRONI_NAME: base-db-2
      APP_DB_USER: ${BASE_DB_USER:-base}
      APP_DB_PASSWORD: ${BASE_DB_PASSWORD:?set BASE_DB_PASSWORD in .env}
      APP_DB_NAME: ${BASE_DB_NAME:-base_service}
    volumes:
      - base-pg-2:/var/lib/postgresql/data

  base-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: base
      PATRONI_NAME: base-db-3
      APP_DB_USER: ${BASE_DB_USER:-base}
      APP_DB_PASSWORD: ${BASE_DB_PASSWORD:?set BASE_DB_PASSWORD in .env}
      APP_DB_NAME: ${BASE_DB_NAME:-base_service}
    volumes:
      - base-pg-3:/var/lib/postgresql/data

  # The name base-service connects to: :5432 is always the leader, :5433 the replicas.
  base-db:
    <<: *db-router
    environment:
      CLUSTER: base
    depends_on:
      - base-db-1
      - base-db-2
      - base-db-3

  base-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: cobili/base-service:5.0.0
    pull_policy: always
    depends_on:
      base-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${BASE_DB_USER:-base}:${BASE_DB_PASSWORD}@base-db:5432/${BASE_DB_NAME:-base_service}
      PORT: 4007
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      DB_POOL: ${DB_POOL:-16}
      # Replicas share Postgres, but the mock stand-ins keep state per process, so they
      # must call the real services. Its own variable: zombie-service still reads MOCK_MODE.
      MOCK_MODE: ${BASE_MOCK_MODE:-false}
      # Sinatra defaults to development mode, which only accepts Host: localhost and answers
      # "403 Host not permitted" to the gateway, which calls it by container address.
      APP_ENV: production
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${BASE_REPLICAS:-2}

  # ------------------------------------------------------------ crafting-service
  # --------------------------------------------- crafting-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  crafting-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: crafting
      PATRONI_NAME: crafting-db-1
      APP_DB_USER: ${CRAFTING_DB_USER:-crafting}
      APP_DB_PASSWORD: ${CRAFTING_DB_PASSWORD:?set CRAFTING_DB_PASSWORD in .env}
      APP_DB_NAME: ${CRAFTING_DB_NAME:-crafting_service}
    volumes:
      - crafting-pg-1:/var/lib/postgresql/data

  crafting-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: crafting
      PATRONI_NAME: crafting-db-2
      APP_DB_USER: ${CRAFTING_DB_USER:-crafting}
      APP_DB_PASSWORD: ${CRAFTING_DB_PASSWORD:?set CRAFTING_DB_PASSWORD in .env}
      APP_DB_NAME: ${CRAFTING_DB_NAME:-crafting_service}
    volumes:
      - crafting-pg-2:/var/lib/postgresql/data

  crafting-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: crafting
      PATRONI_NAME: crafting-db-3
      APP_DB_USER: ${CRAFTING_DB_USER:-crafting}
      APP_DB_PASSWORD: ${CRAFTING_DB_PASSWORD:?set CRAFTING_DB_PASSWORD in .env}
      APP_DB_NAME: ${CRAFTING_DB_NAME:-crafting_service}
    volumes:
      - crafting-pg-3:/var/lib/postgresql/data

  # The name crafting-service connects to: :5432 is always the leader, :5433 the replicas.
  crafting-db:
    <<: *db-router
    environment:
      CLUSTER: crafting
    depends_on:
      - crafting-db-1
      - crafting-db-2
      - crafting-db-3

  crafting-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: cobili/crafting-service:5.0.0
    pull_policy: always
    depends_on:
      crafting-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CRAFTING_DB_USER:-crafting}:${CRAFTING_DB_PASSWORD}@crafting-db:5432/${CRAFTING_DB_NAME:-crafting_service}
      PORT: 4008
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      DB_POOL: ${DB_POOL:-16}
      # Same reason as base-service: replicas must not keep mock state of their own.
      MOCK_MODE: ${CRAFTING_MOCK_MODE:-false}
      APP_ENV: production
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${CRAFTING_REPLICAS:-2}
  # --------------------------------------------------------------- world-service

  # --------------------------------------------- world-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  # `mix test` uses world-service's own docker-compose.yml, which keeps a single Postgres with a port.
  world-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: world
      PATRONI_NAME: world-db-1
      APP_DB_USER: ${WORLD_DB_USER:-world}
      APP_DB_PASSWORD: ${WORLD_DB_PASSWORD:?set WORLD_DB_PASSWORD in .env}
      APP_DB_NAME: ${WORLD_DB_NAME:-world_service}
    volumes:
      - world-pg-1:/var/lib/postgresql/data

  world-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: world
      PATRONI_NAME: world-db-2
      APP_DB_USER: ${WORLD_DB_USER:-world}
      APP_DB_PASSWORD: ${WORLD_DB_PASSWORD:?set WORLD_DB_PASSWORD in .env}
      APP_DB_NAME: ${WORLD_DB_NAME:-world_service}
    volumes:
      - world-pg-2:/var/lib/postgresql/data

  world-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: world
      PATRONI_NAME: world-db-3
      APP_DB_USER: ${WORLD_DB_USER:-world}
      APP_DB_PASSWORD: ${WORLD_DB_PASSWORD:?set WORLD_DB_PASSWORD in .env}
      APP_DB_NAME: ${WORLD_DB_NAME:-world_service}
    volumes:
      - world-pg-3:/var/lib/postgresql/data

  # The name world-service connects to: :5432 is always the leader, :5433 the replicas.
  world-db:
    <<: *db-router
    environment:
      CLUSTER: world
    depends_on:
      - world-db-1
      - world-db-2
      - world-db-3

  world-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    # Migrates on start, published for linux/amd64 and linux/arm64.
    image: alexandramihalevschi/world-service:4.0.0
    pull_policy: always
    depends_on:
      world-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${WORLD_DB_USER:-world}:${WORLD_DB_PASSWORD}@world-db:5432/${WORLD_DB_NAME:-world_service}
      PORT: ${WORLD_PHX_PORT:-4004}
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${WORLD_SECRET_KEY_BASE:?set WORLD_SECRET_KEY_BASE in .env}

      # Signs the service's own outbound tokens.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # The API Gateway sends it as X-Gateway-Secret;
      # a request without it gets 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}

      # Outbound calls to the other services go through the Gateway.
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${WORLD_REPLICAS:-2}

  # ---------------------------------------------------------------- exam-service

  # --------------------------------------------- exam-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  # `mix test` uses exam-service's own docker-compose.yml, which keeps a single Postgres with a port.
  exam-db-1:
    <<: *patroni
    build: ./db-replication/patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: exam
      PATRONI_NAME: exam-db-1
      APP_DB_USER: ${EXAM_DB_USER:-exam}
      APP_DB_PASSWORD: ${EXAM_DB_PASSWORD:?set EXAM_DB_PASSWORD in .env}
      APP_DB_NAME: ${EXAM_DB_NAME:-exam_service}
    volumes:
      - exam-pg-1:/var/lib/postgresql/data

  exam-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: exam
      PATRONI_NAME: exam-db-2
      APP_DB_USER: ${EXAM_DB_USER:-exam}
      APP_DB_PASSWORD: ${EXAM_DB_PASSWORD:?set EXAM_DB_PASSWORD in .env}
      APP_DB_NAME: ${EXAM_DB_NAME:-exam_service}
    volumes:
      - exam-pg-2:/var/lib/postgresql/data

  exam-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: exam
      PATRONI_NAME: exam-db-3
      APP_DB_USER: ${EXAM_DB_USER:-exam}
      APP_DB_PASSWORD: ${EXAM_DB_PASSWORD:?set EXAM_DB_PASSWORD in .env}
      APP_DB_NAME: ${EXAM_DB_NAME:-exam_service}
    volumes:
      - exam-pg-3:/var/lib/postgresql/data

  # The name exam-service connects to: :5432 is always the leader, :5433 the replicas.
  exam-db:
    <<: *db-router
    environment:
      CLUSTER: exam
    depends_on:
      - exam-db-1
      - exam-db-2
      - exam-db-3

  exam-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    # Migrates on start, published for linux/amd64 and linux/arm64.
    image: alexandramihalevschi/exam-service:4.0.0
    pull_policy: always
    depends_on:
      exam-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${EXAM_DB_USER:-exam}:${EXAM_DB_PASSWORD}@exam-db:5432/${EXAM_DB_NAME:-exam_service}
      PORT: ${EXAM_PHX_PORT:-4005}
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${EXAM_SECRET_KEY_BASE:?set EXAM_SECRET_KEY_BASE in .env}

      # Signs the service's own outbound tokens.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # The API Gateway sends it as X-Gateway-Secret;
      # a request without it gets 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}

      # Outbound calls to the other services go through the Gateway.
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${EXAM_REPLICAS:-2}

  # ----------------------------------------------------------------- zombie-service

  # --------------------------------------------- zombie-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  zombie-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: zombie
      PATRONI_NAME: zombie-db-1
      APP_DB_USER: ${ZOMBIE_DB_USER:-zombie}
      APP_DB_PASSWORD: ${ZOMBIE_DB_PASSWORD:?set ZOMBIE_DB_PASSWORD in .env}
      APP_DB_NAME: ${ZOMBIE_DB_NAME:-zombie_service}
    volumes:
      - zombie-pg-1:/var/lib/postgresql/data

  zombie-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: zombie
      PATRONI_NAME: zombie-db-2
      APP_DB_USER: ${ZOMBIE_DB_USER:-zombie}
      APP_DB_PASSWORD: ${ZOMBIE_DB_PASSWORD:?set ZOMBIE_DB_PASSWORD in .env}
      APP_DB_NAME: ${ZOMBIE_DB_NAME:-zombie_service}
    volumes:
      - zombie-pg-2:/var/lib/postgresql/data

  zombie-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: zombie
      PATRONI_NAME: zombie-db-3
      APP_DB_USER: ${ZOMBIE_DB_USER:-zombie}
      APP_DB_PASSWORD: ${ZOMBIE_DB_PASSWORD:?set ZOMBIE_DB_PASSWORD in .env}
      APP_DB_NAME: ${ZOMBIE_DB_NAME:-zombie_service}
    volumes:
      - zombie-pg-3:/var/lib/postgresql/data

  # The name zombie-service connects to: :5432 is always the leader, :5433 the replicas.
  zombie-db:
    <<: *db-router
    environment:
      CLUSTER: zombie
    depends_on:
      - zombie-db-1
      - zombie-db-2
      - zombie-db-3

  zombie-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: tukaram40k/zombie-service:3.0.0
    pull_policy: always
    depends_on:
      zombie-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${ZOMBIE_DB_USER:-zombie}:${ZOMBIE_DB_PASSWORD}@zombie-db:5432/${ZOMBIE_DB_NAME:-zombie_service}
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # The mock stand-ins keep no state, so replicas agree with them on.
      MOCK_MODE: ${MOCK_MODE:-true}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${ZOMBIE_REPLICAS:-2}

  # ----------------------------------------------------------------- resource-service

  # --------------------------------------------- resource-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  resource-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: resource
      PATRONI_NAME: resource-db-1
      APP_DB_USER: ${RESOURCE_DB_USER:-resource}
      APP_DB_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD in .env}
      APP_DB_NAME: ${RESOURCE_DB_NAME:-resource_service}
    volumes:
      - resource-pg-1:/var/lib/postgresql/data

  resource-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: resource
      PATRONI_NAME: resource-db-2
      APP_DB_USER: ${RESOURCE_DB_USER:-resource}
      APP_DB_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD in .env}
      APP_DB_NAME: ${RESOURCE_DB_NAME:-resource_service}
    volumes:
      - resource-pg-2:/var/lib/postgresql/data

  resource-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: resource
      PATRONI_NAME: resource-db-3
      APP_DB_USER: ${RESOURCE_DB_USER:-resource}
      APP_DB_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD in .env}
      APP_DB_NAME: ${RESOURCE_DB_NAME:-resource_service}
    volumes:
      - resource-pg-3:/var/lib/postgresql/data

  # The name resource-service connects to: :5432 is always the leader, :5433 the replicas.
  resource-db:
    <<: *db-router
    environment:
      CLUSTER: resource
    depends_on:
      - resource-db-1
      - resource-db-2
      - resource-db-3

  resource-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: tukaram40k/resource-service:3.0.0
    pull_policy: always
    depends_on:
      resource-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${RESOURCE_DB_USER:-resource}:${RESOURCE_DB_PASSWORD}@resource-db:5432/${RESOURCE_DB_NAME:-resource_service}
      PORT: 4006
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${RESOURCE_REPLICAS:-2}

  # ---------------------------------------------------------------- player-service

  # --------------------------------------------- player-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  player-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: player
      PATRONI_NAME: player-db-1
      APP_DB_USER: ${PLAYER_DB_USER:-player}
      APP_DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
      APP_DB_NAME: ${PLAYER_DB_NAME:-player_service}
    volumes:
      - player-pg-1:/var/lib/postgresql/data

  player-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: player
      PATRONI_NAME: player-db-2
      APP_DB_USER: ${PLAYER_DB_USER:-player}
      APP_DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
      APP_DB_NAME: ${PLAYER_DB_NAME:-player_service}
    volumes:
      - player-pg-2:/var/lib/postgresql/data

  player-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: player
      PATRONI_NAME: player-db-3
      APP_DB_USER: ${PLAYER_DB_USER:-player}
      APP_DB_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
      APP_DB_NAME: ${PLAYER_DB_NAME:-player_service}
    volumes:
      - player-pg-3:/var/lib/postgresql/data

  # The name player-service connects to: :5432 is always the leader, :5433 the replicas.
  player-db:
    <<: *db-router
    environment:
      CLUSTER: player
    depends_on:
      - player-db-1
      - player-db-2
      - player-db-3

  player-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: ${PLAYER_IMAGE:-dimon1/player-service:5.0.0}
    pull_policy: always
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${PLAYER_DB_USER:-player}:${PLAYER_DB_PASSWORD}@player-db:5432/${PLAYER_DB_NAME:-player_service}

      # Its entrypoint waits on Postgres with pg_isready before migrating,
      # so it needs the host and credentials as separate variables too.
      POSTGRES_HOST: player-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${PLAYER_DB_USER:-player}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD}
      POSTGRES_DB: ${PLAYER_DB_NAME:-player_service}

      PHX_HOST: localhost
      PHX_PORT: 4001
      SECRET_KEY_BASE: ${PLAYER_SECRET_KEY_BASE:?set PLAYER_SECRET_KEY_BASE in .env}
      # The gateway validates the JWT, signs it at login, and tells the service who is calling
      # (X-Player-Id / X-Roles / X-Service-Name); the service believes those headers only because
      # the request carries the gateway's X-Gateway-Key. The 3.x release still refuses to start
      # without both token secrets; the service secret is shared under its own name.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      INTERNAL_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # Shared with the gateway. The release refuses to start without both.
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}

      TRADE_TTL_SECONDS: ${PLAYER_TRADE_TTL_SECONDS:-600}
      IDEMPOTENCY_TTL_SECONDS: ${PLAYER_IDEMPOTENCY_TTL_SECONDS:-86400}
      # Registers http://<container id>:4001 with healthPath /api/health.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    # Single instance on its host port: clients connect to its WebSocket directly.
    ports:
      - "4001:4001"

  # ------------------------------------------------------------------ game-service

  # --------------------------------------------- game-db: Patroni cluster + HAProxy (Lab 5)
  # No host port any more: the leader moves between nodes, and the router runs as 2 replicas.
  game-db-1:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: game
      PATRONI_NAME: game-db-1
      APP_DB_USER: ${GAME_DB_USER:-game}
      APP_DB_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      APP_DB_NAME: ${GAME_DB_NAME:-game_service}
    volumes:
      - game-pg-1:/var/lib/postgresql/data

  game-db-2:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: game
      PATRONI_NAME: game-db-2
      APP_DB_USER: ${GAME_DB_USER:-game}
      APP_DB_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      APP_DB_NAME: ${GAME_DB_NAME:-game_service}
    volumes:
      - game-pg-2:/var/lib/postgresql/data

  game-db-3:
    <<: *patroni
    environment:
      <<: *patroni-env
      PATRONI_SCOPE: game
      PATRONI_NAME: game-db-3
      APP_DB_USER: ${GAME_DB_USER:-game}
      APP_DB_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      APP_DB_NAME: ${GAME_DB_NAME:-game_service}
    volumes:
      - game-pg-3:/var/lib/postgresql/data

  # The name game-service connects to: :5432 is always the leader, :5433 the replicas.
  game-db:
    <<: *db-router
    environment:
      CLUSTER: game
    depends_on:
      - game-db-1
      - game-db-2
      - game-db-3

  game-service:
    # Lab 5: a database failover can catch the boot migration mid-election; start again.
    restart: unless-stopped
    image: ${GAME_IMAGE:-dimon1/game-service:5.0.0}
    pull_policy: always

    # The release's start script ships without the executable bit,
    # so the image's own CMD (/app/bin/server) exits with "permission denied".
    # Invoking it through sh runs the same script and migrates and seeds
    # exactly as it was meant to.
    # Drop this line once the bit is fixed upstream.
    command: ["sh", "/app/bin/server"]

    depends_on:
      game-db:
        condition: service_healthy

    environment:
      DATABASE_URL: ecto://${GAME_DB_USER:-game}:${GAME_DB_PASSWORD}@game-db:5432/${GAME_DB_NAME:-game_service}
      SECRET_KEY_BASE: ${GAME_SECRET_KEY_BASE:?set GAME_SECRET_KEY_BASE in .env}
      PORT: 4002
      PHX_HOST: localhost
      PHX_SCHEME: http
      # game-service reads the caller from the gateway's identity headers (it never sees the JWT).
      # JWT_SECRET only feeds the runtime :auth block, and the auth bypass stays off.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      BYPASS_AUTH: "false"

      # Every call game-service makes to another service (world, zombie, resource,
      # exam, player) goes through the gateway, signed with SERVICE_JWT_SECRET.
      GATEWAY_URL: ${GAME_GATEWAY_URL:-http://gateway:8080}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      EXAM_COURSE_ID: ${EXAM_COURSE_ID:-}

      # Shared with the gateway. The release refuses to start without the ticket
      # secret, and the shared key makes it refuse requests that skipped the gateway.
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}

    # Single instance on its host port: clients connect to its WebSocket directly.
    ports:
      - "4002:4002"

  # ---------------------------------------------------------------- message-broker

  # Lab 4: the Message Broker (MessageBroker-team1, 4.1.0). It owns Gateway -> service and
  # service -> service delivery: per-service queues, load balancing, retries, circuit breakers,
  # gRPC on 9090, topics and the dead letter channel. Built from the submodule, since its image
  # isn't on Docker Hub yet.
  #
  # Nothing is routed through it yet: the services and the Gateway use it once BROKER_URL and
  # BROKER_GRPC_URL are set on them, which needs Gateway 4.x, a Player Service with gRPC and a
  # Service Discovery that keeps topics. Until then it runs on its own: GET /health, /v1/topics.
  message-broker:
    image: pad-team1/message-broker:local
    build: ./MessageBroker-team1
    pull_policy: build
    restart: unless-stopped
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      PORT: "8090"
      BROKER_GRPC_PORT: "9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}
      # Empty: the /v1/admin routes are off. Set it to inspect queues, circuits and dead letters.
      BROKER_ADMIN_SECRET: ${BROKER_ADMIN_SECRET:-}
      # static: one Docker name per service (fallback); discovery: every replica registered with
      # Service Discovery; explicit: POST /v1/subscribers.
      BROKER_SUBSCRIBER_SOURCE: static,discovery,explicit
      SERVICE_DISCOVERY_URL: http://service-discovery:8500
      DISCOVERY_POLL_MS: "5000"
      BROKER_PATH_ROUTING: "true"
      # By the load each instance reports in /health (in_flight / max_concurrent).
      BROKER_LB_STRATEGY: ${BROKER_LB_STRATEGY:-service-load}
      # Every delivery on a thread of its own; inline runs them on the event loop.
      BROKER_THREADING: ${BROKER_THREADING:-per-request}
      BROKER_MAX_THREADS: ${BROKER_MAX_THREADS:-64}
      BROKER_REQUEST_TIMEOUT_MS: ${BROKER_REQUEST_TIMEOUT_MS:-8000}
      BROKER_MAX_ATTEMPTS: ${BROKER_MAX_ATTEMPTS:-3}
      BROKER_CIRCUIT_THRESHOLD: ${BROKER_CIRCUIT_THRESHOLD:-3}
      BROKER_CIRCUIT_WINDOW_MS: ${BROKER_CIRCUIT_WINDOW_MS:-35000}
      BROKER_CIRCUIT_OPEN_MS: ${BROKER_CIRCUIT_OPEN_MS:-35000}
      # Dead letters and events waiting in topic queues are kept in memory. BROKER_DATA_DIR: /data
      # would keep them in /data/broker.sqlite across restarts, once the broker's image owns /data
      # (4.1.0's doesn't, so it can't open the file on the broker-data volume).
      BROKER_DLQ_MAX: ${BROKER_DLQ_MAX:-1000}
      BROKER_DLQ_TTL_MS: ${BROKER_DLQ_TTL_MS:-604800000}
      # Name lookups of services with no running container take seconds; more threads keep them
      # from holding up every other outbound call.
      UV_THREADPOOL_SIZE: "32"
    ports:
      - "127.0.0.1:${BROKER_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------- the rest

  # Every service in the contract is now in this file.
  # Keep the shape above for anything new:
  # own database, own volume, required secrets, registered with Service Discovery.

  gateway:
    image: ${GATEWAY_IMAGE:-dimon1/gateway:3.2.2}
    pull_policy: always
    container_name: gateway
    restart: unless-stopped
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-50}
      # The gateway signs the player JWT at login; this is how long it lives (minutes).
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      # Same values as the services' (see .env.example); the gateway won't start without them.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # Round-robins over the instances Service Discovery lists as up, refreshed every poll.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_POLL_MS: ${DISCOVERY_POLL_MS:-5000}
      # Fixed targets, used only while Service Discovery lists no instance of a service
      # (or can't be reached). Docker DNS spreads them over the replicas.
      PLAYER_SERVICE_URL: ${PLAYER_SERVICE_URL:-http://player-service:4001}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://game-service:4002}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL:-http://exam-service:4005}
      WORLD_SERVICE_URL: ${WORLD_SERVICE_URL:-http://world-service:4004}
      ZOMBIE_SERVICE_URL: ${ZOMBIE_SERVICE_URL:-http://zombie-service:4003}
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL:-http://resource-service:4006}
      BASE_SERVICE_URL: ${BASE_SERVICE_URL:-http://base-service:4007}
      CRAFTING_SERVICE_URL: ${CRAFTING_SERVICE_URL:-http://crafting-service:4008}
      # What a CLIENT uses to reach each service's WebSocket directly (the gateway only negotiates).
      PLAYER_SERVICE_WS_URL: ${PLAYER_SERVICE_WS_URL:-ws://localhost:4001}
      GAME_SERVICE_WS_URL: ${GAME_SERVICE_WS_URL:-ws://localhost:4002}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

volumes:
  etcd-1:
  etcd-2:
  etcd-3:
  player-pg-1:
  player-pg-2:
  player-pg-3:
  game-pg-1:
  game-pg-2:
  game-pg-3:
  base-pg-1:
  base-pg-2:
  base-pg-3:
  crafting-pg-1:
  crafting-pg-2:
  crafting-pg-3:
  world-pg-1:
  world-pg-2:
  world-pg-3:
  exam-pg-1:
  exam-pg-2:
  exam-pg-3:
  zombie-pg-1:
  zombie-pg-2:
  zombie-pg-3:
  resource-pg-1:
  resource-pg-2:
  resource-pg-3:
