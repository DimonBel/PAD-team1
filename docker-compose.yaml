# Runs the team's services from the images published on Docker Hub.
# Nothing here builds from a Dockerfile on purpose: the images are the artefact.
#
#   cp .env.example .env     # then fill in every secret
#   docker compose up -d
#
# Each service keeps its own Postgres and its own named volume, so no service can
# read another one's tables. Ports are distinct so everything runs at once.
#
# Lab 3: every service registers itself with Service Discovery, and the gateway
# round-robins over the instances it lists as up. zombie, resource, base,
# crafting, world and exam run as replicas (*_REPLICAS, default 2) and publish
# no host port: replicas can't share one, and every call comes through the
# gateway anyway. player-service and game-service stay single and keep their
# host ports, because clients open their WebSockets on them directly.
# Check a replica's health from inside it, e.g.
#   docker compose exec zombie-service ruby -rnet/http -e 'puts Net::HTTP.get(URI("http://localhost:4003/health"))'

# Every service runs a published Docker Hub image (pull_policy: always): `docker compose up` pulls the
# newest build of each tag and never builds anything locally. Use GATEWAY_IMAGE / SERVICE_DISCOVERY_IMAGE /
# PLAYER_IMAGE / GAME_IMAGE in .env to pin another tag.
services:
  # ----------------------------------------------------------- service-discovery
  service-discovery:
    image: ${SERVICE_DISCOVERY_IMAGE:-dimon1/service-discovery:3.1.5-amd64}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8500"
      # debug also logs a summary of every health sweep.
      LOG_LEVEL: ${SD_LOG_LEVEL:-info}
      # Empty: registration is open. Set it to require X-Discovery-Key on writes;
      # every service below sends the same value.
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
      HEALTH_CHECK_INTERVAL_MS: ${HEALTH_CHECK_INTERVAL_MS:-10000}
      # Health alerts (down / removed / recovered) go to this Discord webhook. Empty: alerts off.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-60000}
      # Periodic all-services digest on the same webhook: 0 = off, otherwise every this many ms.
      DIGEST_INTERVAL_MS: ${DIGEST_INTERVAL_MS:-0}
    ports:
      - "${SERVICE_DISCOVERY_HOST_PORT:-8500}:8500"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8500/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------- base-service
  base-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${BASE_DB_USER:-base}
      POSTGRES_PASSWORD: ${BASE_DB_PASSWORD:?set BASE_DB_PASSWORD in .env}
      POSTGRES_DB: ${BASE_DB_NAME:-base_service}
    volumes:
      - base-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${BASE_DB_USER:-base} -d ${BASE_DB_NAME:-base_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  base-service:
    image: cobili/base-service:3.0.0
    pull_policy: always
    depends_on:
      base-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${BASE_DB_USER:-base}:${BASE_DB_PASSWORD}@base-db:5432/${BASE_DB_NAME:-base_service}
      PORT: 4007
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      DB_POOL: ${DB_POOL:-16}
      # Replicas share Postgres, but the mock stand-ins keep state per process, so they
      # must call the real services. Its own variable: zombie-service still reads MOCK_MODE.
      MOCK_MODE: ${BASE_MOCK_MODE:-false}
      # Sinatra defaults to development mode, which only accepts Host: localhost and answers
      # "403 Host not permitted" to the gateway, which calls it by container address.
      APP_ENV: production
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${BASE_REPLICAS:-2}

  # ------------------------------------------------------------ crafting-service
  crafting-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${CRAFTING_DB_USER:-crafting}
      POSTGRES_PASSWORD: ${CRAFTING_DB_PASSWORD:?set CRAFTING_DB_PASSWORD in .env}
      POSTGRES_DB: ${CRAFTING_DB_NAME:-crafting_service}
    volumes:
      - crafting-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CRAFTING_DB_USER:-crafting} -d ${CRAFTING_DB_NAME:-crafting_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  crafting-service:
    image: cobili/crafting-service:3.0.0
    pull_policy: always
    depends_on:
      crafting-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${CRAFTING_DB_USER:-crafting}:${CRAFTING_DB_PASSWORD}@crafting-db:5432/${CRAFTING_DB_NAME:-crafting_service}
      PORT: 4008
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-8}
      DB_POOL: ${DB_POOL:-16}
      # Same reason as base-service: replicas must not keep mock state of their own.
      MOCK_MODE: ${CRAFTING_MOCK_MODE:-false}
      APP_ENV: production
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${CRAFTING_REPLICAS:-2}
  # --------------------------------------------------------------- world-service

  world-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${WORLD_DB_USER:-world}
      POSTGRES_PASSWORD: ${WORLD_DB_PASSWORD:?set WORLD_DB_PASSWORD in .env}
      POSTGRES_DB: ${WORLD_DB_NAME:-world_service}
    ports:
      - "${WORLD_DB_HOST_PORT:-5434}:5432"
    volumes:
      - world-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WORLD_DB_USER:-world} -d ${WORLD_DB_NAME:-world_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  world-service:
    # Migrates on start, published for linux/amd64 and linux/arm64.
    image: alexandramihalevschi/world-service:3.0.0
    pull_policy: always
    depends_on:
      world-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${WORLD_DB_USER:-world}:${WORLD_DB_PASSWORD}@world-db:5432/${WORLD_DB_NAME:-world_service}
      PORT: ${WORLD_PHX_PORT:-4004}
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${WORLD_SECRET_KEY_BASE:?set WORLD_SECRET_KEY_BASE in .env}

      # Signs the service's own outbound tokens.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # The API Gateway sends it as X-Gateway-Secret;
      # a request without it gets 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}

      # Outbound calls to the other services go through the Gateway.
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${WORLD_REPLICAS:-2}

  # ---------------------------------------------------------------- exam-service

  exam-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${EXAM_DB_USER:-exam}
      POSTGRES_PASSWORD: ${EXAM_DB_PASSWORD:?set EXAM_DB_PASSWORD in .env}
      POSTGRES_DB: ${EXAM_DB_NAME:-exam_service}
    ports:
      - "${EXAM_DB_HOST_PORT:-5435}:5432"
    volumes:
      - exam-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${EXAM_DB_USER:-exam} -d ${EXAM_DB_NAME:-exam_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  exam-service:
    # Migrates on start, published for linux/amd64 and linux/arm64.
    image: alexandramihalevschi/exam-service:3.0.0
    pull_policy: always
    depends_on:
      exam-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${EXAM_DB_USER:-exam}:${EXAM_DB_PASSWORD}@exam-db:5432/${EXAM_DB_NAME:-exam_service}
      PORT: ${EXAM_PHX_PORT:-4005}
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${EXAM_SECRET_KEY_BASE:?set EXAM_SECRET_KEY_BASE in .env}

      # Signs the service's own outbound tokens.
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # The API Gateway sends it as X-Gateway-Secret;
      # a request without it gets 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}

      # Outbound calls to the other services go through the Gateway.
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${EXAM_REPLICAS:-2}

  # ----------------------------------------------------------------- zombie-service

  zombie-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${ZOMBIE_DB_USER:-zombie}
      POSTGRES_PASSWORD: ${ZOMBIE_DB_PASSWORD:?set ZOMBIE_DB_PASSWORD in .env}
      POSTGRES_DB: ${ZOMBIE_DB_NAME:-zombie_service}
    volumes:
      - zombie-pgdata:/var/lib/postgresql/data
    ports:
      # Published so `bundle exec rspec` can reach Postgres from the host.
      - "${ZOMBIE_DB_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ZOMBIE_DB_USER:-zombie} -d ${ZOMBIE_DB_NAME:-zombie_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  zombie-service:
    image: tukaram40k/zombie-service:3.0.0
    pull_policy: always
    depends_on:
      zombie-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${ZOMBIE_DB_USER:-zombie}:${ZOMBIE_DB_PASSWORD}@zombie-db:5432/${ZOMBIE_DB_NAME:-zombie_service}
      PORT: 4003
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # The mock stand-ins keep no state, so replicas agree with them on.
      MOCK_MODE: ${MOCK_MODE:-true}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8080}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${ZOMBIE_REPLICAS:-2}

  # ----------------------------------------------------------------- resource-service

  resource-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${RESOURCE_DB_USER:-resource}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:?set RESOURCE_DB_PASSWORD in .env}
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resource_service}
    volumes:
      - resource-pgdata:/var/lib/postgresql/data
    ports:
      - "${RESOURCE_DB_PORT:-5436}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RESOURCE_DB_USER:-resource} -d ${RESOURCE_DB_NAME:-resource_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  resource-service:
    image: tukaram40k/resource-service:3.0.0
    pull_policy: always
    depends_on:
      resource-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${RESOURCE_DB_USER:-resource}:${RESOURCE_DB_PASSWORD}@resource-db:5432/${RESOURCE_DB_NAME:-resource_service}
      PORT: 4006
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-50}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    deploy:
      replicas: ${RESOURCE_REPLICAS:-2}

  # ---------------------------------------------------------------- player-service

  player-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${PLAYER_DB_USER:-player}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD:?set PLAYER_DB_PASSWORD in .env}
      POSTGRES_DB: ${PLAYER_DB_NAME:-player_service}
    volumes:
      - player-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PLAYER_DB_USER:-player} -d ${PLAYER_DB_NAME:-player_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  player-service:
    image: ${PLAYER_IMAGE:-dimon1/player-service:3.2.2}
    pull_policy: always
    depends_on:
      player-db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://${PLAYER_DB_USER:-player}:${PLAYER_DB_PASSWORD}@player-db:5432/${PLAYER_DB_NAME:-player_service}

      # Its entrypoint waits on Postgres with pg_isready before migrating,
      # so it needs the host and credentials as separate variables too.
      POSTGRES_HOST: player-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${PLAYER_DB_USER:-player}
      POSTGRES_PASSWORD: ${PLAYER_DB_PASSWORD}
      POSTGRES_DB: ${PLAYER_DB_NAME:-player_service}

      PHX_HOST: localhost
      PHX_PORT: 4001
      SECRET_KEY_BASE: ${PLAYER_SECRET_KEY_BASE:?set PLAYER_SECRET_KEY_BASE in .env}
      # The gateway validates the JWT, signs it at login, and tells the service who is calling
      # (X-Player-Id / X-Roles / X-Service-Name); the service believes those headers only because
      # the request carries the gateway's X-Gateway-Key. The 3.x release still refuses to start
      # without both token secrets; the service secret is shared under its own name.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      INTERNAL_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}

      # Shared with the gateway. The release refuses to start without both.
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}

      TRADE_TTL_SECONDS: ${PLAYER_TRADE_TTL_SECONDS:-600}
      IDEMPOTENCY_TTL_SECONDS: ${PLAYER_IDEMPOTENCY_TTL_SECONDS:-86400}
      # Registers http://<container id>:4001 with healthPath /api/health.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}
    # Single instance on its host port: clients connect to its WebSocket directly.
    ports:
      - "4001:4001"

  # ------------------------------------------------------------------ game-service

  game-db:
    image: postgres:16-alpine
    pull_policy: always
    environment:
      POSTGRES_USER: ${GAME_DB_USER:-game}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:?set GAME_DB_PASSWORD in .env}
      POSTGRES_DB: ${GAME_DB_NAME:-game_service}
    volumes:
      - game-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GAME_DB_USER:-game} -d ${GAME_DB_NAME:-game_service}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  game-service:
    image: ${GAME_IMAGE:-dimon1/game-service:3.2.2}
    pull_policy: always

    # The release's start script ships without the executable bit,
    # so the image's own CMD (/app/bin/server) exits with "permission denied".
    # Invoking it through sh runs the same script and migrates and seeds
    # exactly as it was meant to.
    # Drop this line once the bit is fixed upstream.
    command: ["sh", "/app/bin/server"]

    depends_on:
      game-db:
        condition: service_healthy

    environment:
      DATABASE_URL: ecto://${GAME_DB_USER:-game}:${GAME_DB_PASSWORD}@game-db:5432/${GAME_DB_NAME:-game_service}
      SECRET_KEY_BASE: ${GAME_SECRET_KEY_BASE:?set GAME_SECRET_KEY_BASE in .env}
      PORT: 4002
      PHX_HOST: localhost
      PHX_SCHEME: http
      # game-service reads the caller from the gateway's identity headers (it never sees the JWT).
      # JWT_SECRET only feeds the runtime :auth block, and the auth bypass stays off.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      BYPASS_AUTH: "false"

      # Every call game-service makes to another service (world, zombie, resource,
      # exam, player) goes through the gateway, signed with SERVICE_JWT_SECRET.
      GATEWAY_URL: ${GAME_GATEWAY_URL:-http://gateway:8080}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      EXAM_COURSE_ID: ${EXAM_COURSE_ID:-}

      # Shared with the gateway. The release refuses to start without the ticket
      # secret, and the shared key makes it refuse requests that skipped the gateway.
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_SECRET: ${DISCOVERY_SECRET:-}

    # Single instance on its host port: clients connect to its WebSocket directly.
    ports:
      - "4002:4002"

  # ------------------------------------------------------------------- the rest

  # Every service in the contract is now in this file.
  # Keep the shape above for anything new:
  # own database, own volume, required secrets, registered with Service Discovery.

  gateway:
    image: ${GATEWAY_IMAGE:-dimon1/gateway:3.2.2}
    pull_policy: always
    container_name: gateway
    restart: unless-stopped
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-10000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-50}
      # The gateway signs the player JWT at login; this is how long it lives (minutes).
      JWT_TTL_MIN: ${JWT_TTL_MIN:-60}
      # Same values as the services' (see .env.example); the gateway won't start without them.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:?set SERVICE_JWT_SECRET in .env (at least 32 characters, e.g. from openssl rand -hex 32)}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # Round-robins over the instances Service Discovery lists as up, refreshed every poll.
      SERVICE_DISCOVERY_URL: ${SERVICE_DISCOVERY_URL:-http://service-discovery:8500}
      DISCOVERY_POLL_MS: ${DISCOVERY_POLL_MS:-5000}
      # Fixed targets, used only while Service Discovery lists no instance of a service
      # (or can't be reached). Docker DNS spreads them over the replicas.
      PLAYER_SERVICE_URL: ${PLAYER_SERVICE_URL:-http://player-service:4001}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://game-service:4002}
      EXAM_SERVICE_URL: ${EXAM_SERVICE_URL:-http://exam-service:4005}
      WORLD_SERVICE_URL: ${WORLD_SERVICE_URL:-http://world-service:4004}
      ZOMBIE_SERVICE_URL: ${ZOMBIE_SERVICE_URL:-http://zombie-service:4003}
      RESOURCE_SERVICE_URL: ${RESOURCE_SERVICE_URL:-http://resource-service:4006}
      BASE_SERVICE_URL: ${BASE_SERVICE_URL:-http://base-service:4007}
      CRAFTING_SERVICE_URL: ${CRAFTING_SERVICE_URL:-http://crafting-service:4008}
      # What a CLIENT uses to reach each service's WebSocket directly (the gateway only negotiates).
      PLAYER_SERVICE_WS_URL: ${PLAYER_SERVICE_WS_URL:-ws://localhost:4001}
      GAME_SERVICE_WS_URL: ${GAME_SERVICE_WS_URL:-ws://localhost:4002}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?set GATEWAY_SHARED_SECRET in .env}
      WS_TICKET_SECRET: ${WS_TICKET_SECRET:?set WS_TICKET_SECRET in .env}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

volumes:
  player-pgdata:
  game-pgdata:
  base-pgdata:
  crafting-pgdata:
  world-pgdata:
  exam-pgdata:
  zombie-pgdata:
  resource-pgdata:
