<text xml:space="preserve" style="white-space:pre" font-size="17" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="189.9">1  Extract</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="13" fill="#495057" text-anchor="start"><tspan x="544.0" y="213.5">rows changed since the table's watermark, in keyset pages,</tspan><tspan x="544.0" y="229.7">5 s overlap · tables without a timestamp are read in full</tspan></text>
<rect x="530.0" y="266.0" width="600.0" height="88.0" rx="10.0" fill="#ffffff" stroke="#862e9c" stroke-width="1.5"/>
<text xml:space="preserve" style="white-space:pre" font-size="17" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="295.9">2  Transform rows</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="13" fill="#495057" text-anchor="start"><tspan x="544.0" y="319.5">JSON stored as text → jsonb (bad JSON counted)</tspan><tspan x="544.0" y="335.7">players.password_hash is dropped, never copied</tspan></text>
<path d="M830.0,248.0 L830.0,266.0" fill="none" stroke="#862e9c" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#m862e9c)"/>
<rect x="530.0" y="372.0" width="600.0" height="88.0" rx="10.0" fill="#ffffff" stroke="#862e9c" stroke-width="1.5"/>
<text xml:space="preserve" style="white-space:pre" font-size="17" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="401.9">3  Load staging</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="13" fill="#495057" text-anchor="start"><tspan x="544.0" y="425.5">upsert into staging.rows (source, table, pk, row jsonb);</tspan><tspan x="544.0" y="441.7">a row identical to the staged one is skipped</tspan></text>
<path d="M830.0,354.0 L830.0,372.0" fill="none" stroke="#862e9c" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#m862e9c)"/>
<rect x="530.0" y="478.0" width="600.0" height="88.0" rx="10.0" fill="#ffffff" stroke="#862e9c" stroke-width="1.5"/>
<text xml:space="preserve" style="white-space:pre" font-size="17" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="507.9">4  Build the star schema</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="13" fill="#495057" text-anchor="start"><tspan x="544.0" y="531.5">one SQL upsert per dw table (warehouse-model.ts): types,</tspan><tspan x="544.0" y="547.7">UTC, date_key, old and new column names</tspan></text>
<path d="M830.0,460.0 L830.0,478.0" fill="none" stroke="#862e9c" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#m862e9c)"/>
<rect x="530.0" y="584.0" width="600.0" height="88.0" rx="10.0" fill="#ffffff" stroke="#862e9c" stroke-width="1.5"/>
<text xml:space="preserve" style="white-space:pre" font-size="17" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="622.1">5  Move the watermark</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="13" fill="#495057" text-anchor="start"><tspan x="544.0" y="645.6">to the highest cursor value loaded</tspan></text>
<path d="M830.0,566.0 L830.0,584.0" fill="none" stroke="#862e9c" stroke-width="2.0" stroke-linejoin="round" marker-end="url(#m862e9c)"/>
<rect x="530.0" y="690.0" width="700.0" height="125.0" rx="10.0" fill="#ffffff" stroke="#862e9c" stroke-width="1.5"/>
<text xml:space="preserve" style="white-space:pre" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="544.0" y="716.6">Runs</tspan></text>
<text xml:space="preserve" style="white-space:pre" font-size="12" fill="#495057" text-anchor="start"><tspan x="544.0" y="738.5">steps 3–5: one warehouse transaction per table, so a failure rolls back only that table</tspan><tspan x="544.0" y="753.5">every ETL_INTERVAL_S = 60 s, and on POST /v1/runs (X-Admin-Key)</tspan><tspan x="544.0" y="768.5">every 10 runs: reconcile, rows gone from a source → is_deleted = true</tspan><tspan x="544.0" y="783.5">one run at a time (advisory lock) · a source that is down fails only its tables</tspan><tspan x="544.0" y="798.5">GET /health · GET /metrics</tspan></text>
